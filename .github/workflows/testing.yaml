---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - '**'
      - '!.github/**'
      - '!.*'
      - '!tox.ini'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Test local GitHub Action"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15 # Increased for comprehensive redirect tests
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      ### Setup local go-httpbin service for reliable testing ###
      - name: 'Setup local go-httpbin service'
        id: httpbin
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/go-httpbin-action@8b66d1d684264a26f4b087c94485aeb2be45cea7 # v0.1.5
        with:
          skip-certificate: 'true'  # Use HTTP for simpler testing
          debug: 'true'

      ### Basic URL Validity Tests ###

      # Test with a valid URL that should always work
      - name: 'Test valid URL (Google)'
        id: test-valid
        uses: ./
        with:
          url: 'https://www.google.com'

      - name: 'Verify valid URL test passed'
        shell: bash
        run: |
          if [ "${STEPS_TEST_VALID_OUTPUTS_VALID}" != "true" ]; then
            echo 'Error: Valid URL test failed ❌'
            exit 1
          fi
          echo 'Valid URL test passed ✅'
        env:
          STEPS_TEST_VALID_OUTPUTS_VALID: ${{ steps.test-valid.outputs.valid }}

      # Test with an invalid URL that should fail
      - name: 'Test invalid URL'
        id: test-invalid
        uses: ./
        with:
          url: 'https://this-domain-should-not-exist-12345.invalid'

      - name: 'Verify invalid URL test failed as expected'
        shell: bash
        run: |
          if [ "${STEPS_TEST_INVALID_OUTPUTS_VALID}" != "false" ]; then
            echo 'Error: Invalid URL test should have failed ❌'
            exit 1
          fi
          echo 'Invalid URL test failed as expected ✅'
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_INVALID_OUTPUTS_VALID: ${{ steps.test-invalid.outputs.valid }}

      # Test with Linux Foundation URL (real world example)
      - name: 'Test Linux Foundation URL'
        id: test-lf
        uses: ./
        with:
          url: 'https://linuxfoundation.org'

      - name: 'Verify Linux Foundation URL test'
        shell: bash
        run: |
          if [ "${STEPS_TEST_LF_OUTPUTS_VALID}" != "true" ]; then
            echo 'Error: Linux Foundation URL test failed ❌'
            exit 1
          fi
          echo 'Linux Foundation URL test passed ✅'
        env:
          STEPS_TEST_LF_OUTPUTS_VALID: ${{ steps.test-lf.outputs.valid }}

      ### Enhanced Tests Using Local go-httpbin ###

      # Test 200 OK status
      - name: 'Test 200 OK status'
        id: test-200
        uses: ./
        with:
          url: '${{ steps.httpbin.outputs.service-url }}/status/200'

      - name: 'Verify 200 OK test results'
        shell: bash
        run: |
          if [ "${STEPS_TEST_200_OUTPUTS_VALID}" != "true" ]; then
            echo 'Error: 200 OK test failed ❌'
            exit 1
          fi
          if [ "${STEPS_TEST_200_OUTPUTS_HTTP_CODE}" != "200" ]; then
            echo 'Error: Expected HTTP 200, got' \
              "${STEPS_TEST_200_OUTPUTS_HTTP_CODE} ❌"
            exit 1
          fi
          echo '200 OK test passed ✅'
        env:
          STEPS_TEST_200_OUTPUTS_VALID: ${{ steps.test-200.outputs.valid }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_200_OUTPUTS_HTTP_CODE: ${{ steps.test-200.outputs.http_code }}

      # Test 404 Not Found status
      - name: 'Test 404 Not Found status'
        id: test-404
        uses: ./
        with:
          url: '${{ steps.httpbin.outputs.service-url }}/status/404'

      - name: 'Verify 404 Not Found test results'
        shell: bash
        run: |
          if [ "${STEPS_TEST_404_OUTPUTS_VALID}" != "false" ]; then
            echo 'Error: 404 test should have failed ❌'
            exit 1
          fi
          if [ "${STEPS_TEST_404_OUTPUTS_HTTP_CODE}" != "404" ]; then
            echo 'Error: Expected HTTP 404, got' \
              "${STEPS_TEST_404_OUTPUTS_HTTP_CODE} ❌"
            exit 1
          fi
          echo '404 Not Found test passed ✅'
        env:
          STEPS_TEST_404_OUTPUTS_VALID: ${{ steps.test-404.outputs.valid }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_404_OUTPUTS_HTTP_CODE: ${{ steps.test-404.outputs.http_code }}

      # Test single redirect
      - name: 'Test single redirect'
        id: test-redirect-1
        uses: ./
        with:
          url: '${{ steps.httpbin.outputs.service-url }}/redirect/1'

      - name: 'Verify single redirect test results'
        shell: bash
        run: |
          if [ "${STEPS_TEST_REDIRECT_1_OUTPUTS_VALID}" != "true" ]; then
            echo 'Error: Single redirect test failed ❌'
            exit 1
          fi
          if [ "${STEPS_TEST_REDIRECT_1_OUTPUTS_HTTP_CODE}" != "200" ]; then
            echo 'Error: Expected final HTTP 200, got' \
              "${STEPS_TEST_REDIRECT_1_OUTPUTS_HTTP_CODE} ❌"
            exit 1
          fi
          if [ -z "${STEPS_TEST_REDIRECT_1_OUTPUTS_REDIRECT_URL}" ]; then
            echo 'Error: Expected redirect URL to be captured ❌'
            exit 1
          fi
          if [ "${STEPS_TEST_REDIRECT_1_OUTPUTS_REDIRECT_VALID}" != "true" ]
          then
            echo 'Error: Expected redirect to be valid ❌'
            exit 1
          fi
          if [ "${STEPS_TEST_REDIRECT_1_OUTPUTS_REDIRECT_LOOP}" != "false" ]
          then
            echo 'Error: Expected no redirect loop ❌'
            exit 1
          fi
          echo 'Single redirect test passed ✅'
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_REDIRECT_1_OUTPUTS_VALID: ${{ steps.test-redirect-1.outputs.valid }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_REDIRECT_1_OUTPUTS_HTTP_CODE: ${{ steps.test-redirect-1.outputs.http_code }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_REDIRECT_1_OUTPUTS_REDIRECT_URL: ${{ steps.test-redirect-1.outputs.redirect_url }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_REDIRECT_1_OUTPUTS_REDIRECT_VALID: ${{ steps.test-redirect-1.outputs.redirect_valid }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_REDIRECT_1_OUTPUTS_REDIRECT_LOOP: ${{ steps.test-redirect-1.outputs.redirect_loop }}

      # Test multiple redirects
      - name: 'Test multiple redirects'
        id: test-redirect-3
        uses: ./
        with:
          url: '${{ steps.httpbin.outputs.service-url }}/redirect/3'

      - name: 'Verify multiple redirects test results'
        shell: bash
        run: |
          if [ "${STEPS_TEST_REDIRECT_3_OUTPUTS_VALID}" != "true" ]; then
            echo 'Error: Multiple redirects test failed ❌'
            exit 1
          fi
          if [ "${STEPS_TEST_REDIRECT_3_OUTPUTS_HTTP_CODE}" != "200" ]; then
            echo 'Error: Expected final HTTP 200, got' \
              "${STEPS_TEST_REDIRECT_3_OUTPUTS_HTTP_CODE} ❌"
            exit 1
          fi
          if [ -z "${STEPS_TEST_REDIRECT_3_OUTPUTS_REDIRECT_URL}" ]; then
            echo 'Error: Expected redirect URL to be captured ❌'
            exit 1
          fi
          if [ "${STEPS_TEST_REDIRECT_3_OUTPUTS_REDIRECT_VALID}" != "true" ]
          then
            echo 'Error: Expected redirect to be valid ❌'
            exit 1
          fi
          if [ "${STEPS_TEST_REDIRECT_3_OUTPUTS_REDIRECT_LOOP}" != "false" ]
          then
            echo 'Error: Expected no redirect loop ❌'
            exit 1
          fi
          echo 'Multiple redirects test passed ✅'
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_REDIRECT_3_OUTPUTS_VALID: ${{ steps.test-redirect-3.outputs.valid }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_REDIRECT_3_OUTPUTS_HTTP_CODE: ${{ steps.test-redirect-3.outputs.http_code }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_REDIRECT_3_OUTPUTS_REDIRECT_URL: ${{ steps.test-redirect-3.outputs.redirect_url }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_REDIRECT_3_OUTPUTS_REDIRECT_VALID: ${{ steps.test-redirect-3.outputs.redirect_valid }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_REDIRECT_3_OUTPUTS_REDIRECT_LOOP: ${{ steps.test-redirect-3.outputs.redirect_loop }}

      # Test redirect to invalid URL
      - name: 'Test redirect to invalid URL'
        id: test-redirect-404
        uses: ./
        with:
          # yamllint disable rule:line-length
          url: >-
            ${{ steps.httpbin.outputs.service-url }}/redirect-to?url=${{ steps.httpbin.outputs.service-url }}/status/404
          # yamllint enable rule:line-length

      - name: 'Verify redirect to invalid URL test results'
        shell: bash
        run: |
          if [ "${STEPS_TEST_REDIRECT_404_OUTPUTS_VALID}" != "false" ]; then
            echo 'Error: Redirect to 404 should have failed ❌'
            exit 1
          fi
          if [ "${STEPS_TEST_REDIRECT_404_OUTPUTS_HTTP_CODE}" != "404" ]
          then
            echo 'Error: Expected final HTTP 404, got' \
              "${STEPS_TEST_REDIRECT_404_OUTPUTS_HTTP_CODE} ❌"
            exit 1
          fi
          if [ -z "${STEPS_TEST_REDIRECT_404_OUTPUTS_REDIRECT_URL}" ]
          then
            echo 'Error: Expected redirect URL to be captured ❌'
            exit 1
          fi
          if [ "${STEPS_TEST_REDIRECT_404_OUTPUTS_REDIRECT_VALID}" \
            != "false" ]; then
            echo 'Error: Expected redirect to be invalid ❌'; exit 1
          fi
          if [ "${STEPS_TEST_REDIRECT_404_OUTPUTS_REDIRECT_LOOP}" \
            != "false" ]; then
            echo 'Error: Expected no redirect loop ❌'; exit 1
          fi
          echo 'Redirect to invalid URL test passed ✅'
        env:
          # yamllint disable-line rule:line-length
          STEPS_TEST_REDIRECT_404_OUTPUTS_VALID: ${{ steps.test-redirect-404.outputs.valid }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_REDIRECT_404_OUTPUTS_HTTP_CODE: ${{ steps.test-redirect-404.outputs.http_code }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_REDIRECT_404_OUTPUTS_REDIRECT_URL: ${{ steps.test-redirect-404.outputs.redirect_url }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_REDIRECT_404_OUTPUTS_REDIRECT_VALID: ${{ steps.test-redirect-404.outputs.redirect_valid }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_REDIRECT_404_OUTPUTS_REDIRECT_LOOP: ${{ steps.test-redirect-404.outputs.redirect_loop }}

      # Test 500 Internal Server Error
      - name: 'Test 500 Internal Server Error'
        id: test-500
        uses: ./
        with:
          url: '${{ steps.httpbin.outputs.service-url }}/status/500'

      - name: 'Verify 500 Internal Server Error test results'
        shell: bash
        run: |
          if [ "${STEPS_TEST_500_OUTPUTS_VALID}" != "false" ]; then
            echo 'Error: 500 error test should have failed ❌'
            exit 1
          fi
          if [ "${STEPS_TEST_500_OUTPUTS_HTTP_CODE}" != "500" ]; then
            echo 'Error: Expected HTTP 500, got' \
              "${STEPS_TEST_500_OUTPUTS_HTTP_CODE} ❌"
            exit 1
          fi
          echo '500 Internal Server Error test passed ✅'
        env:
          STEPS_TEST_500_OUTPUTS_VALID: ${{ steps.test-500.outputs.valid }}
          # yamllint disable-line rule:line-length
          STEPS_TEST_500_OUTPUTS_HTTP_CODE: ${{ steps.test-500.outputs.http_code }}

      # Generate comprehensive test summary
      # yamllint disable rule:line-length
      - name: 'Generate test summary'
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          # URL Validity Action Test Results 🧪

          ## Basic Functionality Tests
          | Test | Valid | HTTP Code | Status |
          |------|-------|-----------|--------|
          | Google (External) | ${STEPS_TEST_VALID_OUTPUTS_VALID} | ${STEPS_TEST_VALID_OUTPUTS_HTTP_CODE} | ✅ |
          | Invalid Domain | ${STEPS_TEST_INVALID_OUTPUTS_VALID} | ${STEPS_TEST_INVALID_OUTPUTS_HTTP_CODE} | ✅ |
          | Linux Foundation | ${STEPS_TEST_LF_OUTPUTS_VALID} | ${STEPS_TEST_LF_OUTPUTS_HTTP_CODE} | ✅ |

          ## HTTP Status Code Tests
          | Status Code | Valid | HTTP Code | Status |
          |-------------|-------|-----------|---------|
          | 200 OK | ${STEPS_TEST_200_OUTPUTS_VALID} | ${STEPS_TEST_200_OUTPUTS_HTTP_CODE} | ✅ |
          | 404 Not Found | ${STEPS_TEST_404_OUTPUTS_VALID} | ${STEPS_TEST_404_OUTPUTS_HTTP_CODE} | ✅ |
          | 500 Server Error | ${STEPS_TEST_500_OUTPUTS_VALID} | ${STEPS_TEST_500_OUTPUTS_HTTP_CODE} | ✅ |

          ## Redirect Tests
          | Test | Valid | HTTP Code | Redirect URL | Redirect Valid | Loop | Status |
          |------|-------|-----------|--------------|----------------|------|--------|
          | Single Redirect | ${STEPS_TEST_REDIRECT_1_OUTPUTS_VALID} | ${STEPS_TEST_REDIRECT_1_OUTPUTS_HTTP_CODE} | ${STEPS_TEST_REDIRECT_1_OUTPUTS_REDIRECT_URL} | ${STEPS_TEST_REDIRECT_1_OUTPUTS_REDIRECT_VALID} | ${STEPS_TEST_REDIRECT_1_OUTPUTS_REDIRECT_LOOP} | ✅ |
          | Multiple Redirects | ${STEPS_TEST_REDIRECT_3_OUTPUTS_VALID} | ${STEPS_TEST_REDIRECT_3_OUTPUTS_HTTP_CODE} | ${STEPS_TEST_REDIRECT_3_OUTPUTS_REDIRECT_URL} | ${STEPS_TEST_REDIRECT_3_OUTPUTS_REDIRECT_VALID} | ${STEPS_TEST_REDIRECT_3_OUTPUTS_REDIRECT_LOOP} | ✅ |
          | Redirect to 404 | ${STEPS_TEST_REDIRECT_404_OUTPUTS_VALID} | ${STEPS_TEST_REDIRECT_404_OUTPUTS_HTTP_CODE} | ${STEPS_TEST_REDIRECT_404_OUTPUTS_REDIRECT_URL} | ${STEPS_TEST_REDIRECT_404_OUTPUTS_REDIRECT_VALID} | ${STEPS_TEST_REDIRECT_404_OUTPUTS_REDIRECT_LOOP} | ✅ |

          ## New Features Validated ✨
          - ✅ **HTTP Status Code Capture**: Captures HTTP response codes (200, 404, 500)
          - ✅ **Redirect URL Capture**: Captures final redirect destinations
          - ✅ **Redirect Validity Check**: Validates if redirected URLs are accessible
          - ✅ **Redirect Loop Detection**: Detects absence of redirect loops
          - ✅ **Error Handling**: Properly handles various HTTP error conditions

          All enhanced URL validity tests completed successfully! 🎉
          EOF

          echo 'All comprehensive URL validity tests completed!'
        env:
          STEPS_TEST_VALID_OUTPUTS_VALID: ${{ steps.test-valid.outputs.valid }}
          STEPS_TEST_VALID_OUTPUTS_HTTP_CODE: ${{ steps.test-valid.outputs.http_code }}
          STEPS_TEST_INVALID_OUTPUTS_VALID: ${{ steps.test-invalid.outputs.valid }}
          STEPS_TEST_INVALID_OUTPUTS_HTTP_CODE: ${{ steps.test-invalid.outputs.http_code }}
          STEPS_TEST_LF_OUTPUTS_VALID: ${{ steps.test-lf.outputs.valid }}
          STEPS_TEST_LF_OUTPUTS_HTTP_CODE: ${{ steps.test-lf.outputs.http_code }}
          STEPS_TEST_200_OUTPUTS_VALID: ${{ steps.test-200.outputs.valid }}
          STEPS_TEST_200_OUTPUTS_HTTP_CODE: ${{ steps.test-200.outputs.http_code }}
          STEPS_TEST_404_OUTPUTS_VALID: ${{ steps.test-404.outputs.valid }}
          STEPS_TEST_404_OUTPUTS_HTTP_CODE: ${{ steps.test-404.outputs.http_code }}
          STEPS_TEST_500_OUTPUTS_VALID: ${{ steps.test-500.outputs.valid }}
          STEPS_TEST_500_OUTPUTS_HTTP_CODE: ${{ steps.test-500.outputs.http_code }}
          STEPS_TEST_REDIRECT_1_OUTPUTS_VALID: ${{ steps.test-redirect-1.outputs.valid }}
          STEPS_TEST_REDIRECT_1_OUTPUTS_HTTP_CODE: ${{ steps.test-redirect-1.outputs.http_code }}
          STEPS_TEST_REDIRECT_1_OUTPUTS_REDIRECT_URL: ${{ steps.test-redirect-1.outputs.redirect_url }}
          STEPS_TEST_REDIRECT_1_OUTPUTS_REDIRECT_VALID: ${{ steps.test-redirect-1.outputs.redirect_valid }}
          STEPS_TEST_REDIRECT_1_OUTPUTS_REDIRECT_LOOP: ${{ steps.test-redirect-1.outputs.redirect_loop }}
          STEPS_TEST_REDIRECT_3_OUTPUTS_VALID: ${{ steps.test-redirect-3.outputs.valid }}
          STEPS_TEST_REDIRECT_3_OUTPUTS_HTTP_CODE: ${{ steps.test-redirect-3.outputs.http_code }}
          STEPS_TEST_REDIRECT_3_OUTPUTS_REDIRECT_URL: ${{ steps.test-redirect-3.outputs.redirect_url }}
          STEPS_TEST_REDIRECT_3_OUTPUTS_REDIRECT_VALID: ${{ steps.test-redirect-3.outputs.redirect_valid }}
          STEPS_TEST_REDIRECT_3_OUTPUTS_REDIRECT_LOOP: ${{ steps.test-redirect-3.outputs.redirect_loop }}
          STEPS_TEST_REDIRECT_404_OUTPUTS_VALID: ${{ steps.test-redirect-404.outputs.valid }}
          STEPS_TEST_REDIRECT_404_OUTPUTS_HTTP_CODE: ${{ steps.test-redirect-404.outputs.http_code }}
          STEPS_TEST_REDIRECT_404_OUTPUTS_REDIRECT_URL: ${{ steps.test-redirect-404.outputs.redirect_url }}
          STEPS_TEST_REDIRECT_404_OUTPUTS_REDIRECT_VALID: ${{ steps.test-redirect-404.outputs.redirect_valid }}
          STEPS_TEST_REDIRECT_404_OUTPUTS_REDIRECT_LOOP: ${{ steps.test-redirect-404.outputs.redirect_loop }}
